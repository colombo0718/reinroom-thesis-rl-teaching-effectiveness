<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>圖 5-3 五任務完成率比較</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script src="data.js"></script>
<style>
  body {
    margin: 0;
    padding: 40px;
    font-family: "標楷體", "DFKai-SB", "PMingLiU", serif;
    background: white;
    width: 1200px;
    height: 800px;
    box-sizing: border-box;
  }
  .figure {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
  }
  .title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 14px;
    color: #555;
    margin-bottom: 20px;
  }
  .chart-container {
    width: 1100px;
    height: 580px;
    position: relative;
  }
  .footnote {
    margin-top: 16px;
    font-size: 13px;
    color: #444;
    line-height: 1.6;
    max-width: 1100px;
  }
  .highlight {
    color: #c00;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="figure">
  <div class="title">圖 5-3　兩組學生於五項任務之完成率比較</div>
  <div class="subtitle">實驗組 A（RL Lab，大二，n=18）vs 對照組 B（Colab，碩一，n=12）</div>
  <div class="chart-container">
    <canvas id="chart"></canvas>
  </div>
  <div class="footnote">
    註：T1、T2 之分母為 Day 1 出席人數（前測有效，A=26, B=15）；T3–T5 之分母為 Day 2 出席人數（後測有效，A=18, B=12）。
    <span class="highlight">T5 Fighter 為「無預設超參數，自主設定」之最高難度任務</span>，實驗組完成率為對照組的 2.4 倍。
  </div>
</div>

<script>
const t = window.DATA.task_completion;
const labels = t.tasks;
const A_pct = t.A_rate.map(r => +(r * 100).toFixed(1));
const B_pct = t.B_rate.map(r => +(r * 100).toFixed(1));

new Chart(document.getElementById('chart'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [
      {
        label: '實驗組 A（RL Lab）',
        data: A_pct,
        backgroundColor: 'rgba(46, 134, 222, 0.85)',
        borderColor: 'rgba(46, 134, 222, 1)',
        borderWidth: 2,
        borderRadius: 4,
      },
      {
        label: '對照組 B（Gymnasium + Colab）',
        data: B_pct,
        backgroundColor: 'rgba(255, 159, 67, 0.85)',
        borderColor: 'rgba(255, 159, 67, 1)',
        borderWidth: 2,
        borderRadius: 4,
      },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: {
        position: 'top',
        labels: { font: { size: 16 } },
      },
      datalabels: false,
      tooltip: { enabled: false },
    },
    scales: {
      x: {
        ticks: { font: { size: 16, weight: 'bold' } },
        grid: { display: false },
      },
      y: {
        beginAtZero: true,
        max: 80,
        ticks: {
          font: { size: 14 },
          callback: v => v + '%',
        },
        title: {
          display: true,
          text: '完成率（%）',
          font: { size: 15 },
        },
        grid: { color: '#eee' },
      },
    },
  },
  plugins: [{
    id: 'valueLabels',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      ctx.save();
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      chart.data.datasets.forEach((ds, di) => {
        const meta = chart.getDatasetMeta(di);
        meta.data.forEach((bar, bi) => {
          const v = ds.data[bi];
          ctx.fillStyle = di === 0 ? '#1a5f9e' : '#c97800';
          // 在 T5 (idx=4) 強調顯示
          if (bi === 4) {
            ctx.font = 'bold 18px sans-serif';
            ctx.fillStyle = di === 0 ? '#c00' : '#666';
          } else {
            ctx.font = 'bold 14px sans-serif';
          }
          ctx.fillText(v + '%', bar.x, bar.y - 8);
        });
      });
      ctx.restore();
    },
  }],
});
</script>
</body>
</html>
