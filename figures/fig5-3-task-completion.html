<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>圖 5-3 五任務完成率比較</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script src="data.js"></script>
<style>
  body {
    margin: 0;
    padding: 40px;
    font-family: "標楷體", "DFKai-SB", "PMingLiU", serif;
    background: white;
    width: 1200px;
    height: 640px;
    box-sizing: border-box;
  }
  .figure {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
  }
  .chart-container {
    width: 1100px;
    height: 580px;
    position: relative;
  }
  .highlight {
    color: #c00;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="figure">
  <div class="chart-container">
    <canvas id="chart"></canvas>
  </div>
  </div>

<script>
const t = window.DATA.task_completion;
const labels = t.tasks;
const A_pct = t.A_rate.map(r => +(r * 100).toFixed(1));
const B_pct = t.B_rate.map(r => +(r * 100).toFixed(1));

new Chart(document.getElementById('chart'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [
      {
        label: 'RR 組（A）',
        data: A_pct,
        backgroundColor: 'rgba(46, 134, 222, 0.85)',
        borderColor: 'rgba(46, 134, 222, 1)',
        borderWidth: 2,
        borderRadius: 4,
      },
      {
        label: 'Colab 組（B）',
        data: B_pct,
        backgroundColor: 'rgba(255, 159, 67, 0.85)',
        borderColor: 'rgba(255, 159, 67, 1)',
        borderWidth: 2,
        borderRadius: 4,
      },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: {
        position: 'top',
        labels: { font: { size: 16 } },
      },
      datalabels: false,
      tooltip: { enabled: false },
    },
    scales: {
      x: {
        ticks: { font: { size: 16, weight: 'bold' } },
        grid: { display: false },
      },
      y: {
        beginAtZero: true,
        max: 80,
        ticks: {
          font: { size: 14 },
          callback: v => v + '%',
        },
        title: {
          display: true,
          text: '完成率（%）',
          font: { size: 15 },
        },
        grid: { color: '#eee' },
      },
    },
  },
  plugins: [{
    id: 'valueLabels',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      ctx.save();
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      chart.data.datasets.forEach((ds, di) => {
        const meta = chart.getDatasetMeta(di);
        meta.data.forEach((bar, bi) => {
          const v = ds.data[bi];
          ctx.fillStyle = di === 0 ? '#1a5f9e' : '#c97800';
          ctx.font = 'bold 14px sans-serif';
          ctx.fillText(v + '%', bar.x, bar.y - 8);
        });
      });

      // 於每個任務上方標示卡方檢定 p 值與 Cramer's V
      const chi2 = window.DATA.stats.completion_chi2;
      const keys = ['T1', 'T2', 'T3', 'T4', 'T5'];
      const meta0 = chart.getDatasetMeta(0);
      const meta1 = chart.getDatasetMeta(1);
      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#444';
      ctx.textAlign = 'center';
      keys.forEach((k, idx) => {
        const stat = chi2[k];
        const x = (meta0.data[idx].x + meta1.data[idx].x) / 2;
        const y = Math.min(meta0.data[idx].y, meta1.data[idx].y) - 30;
        ctx.fillText(`p=${stat.p.toFixed(3)} ${stat.sig}, V=${stat.V.toFixed(3)}`, x, y);
      });
      ctx.restore();
    },
  }],
});
</script>
</body>
</html>
