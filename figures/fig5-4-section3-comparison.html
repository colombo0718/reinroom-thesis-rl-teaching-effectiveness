<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>圖 5-4 Section 3 平台回饋比較</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script src="data.js"></script>
<style>
  body {
    margin: 0;
    padding: 40px;
    font-family: "標楷體", "DFKai-SB", "PMingLiU", serif;
    background: white;
    width: 1200px;
    height: 800px;
    box-sizing: border-box;
  }
  .figure { display: flex; flex-direction: column; align-items: center; height: 100%; }
  .title { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: #555; margin-bottom: 20px; }
  .chart-container { width: 1100px; height: 580px; position: relative; }
  .footnote { margin-top: 16px; font-size: 13px; color: #444; line-height: 1.6; max-width: 1100px; }
  .highlight { color: #c00; font-weight: bold; }
</style>
</head>
<body>
<div class="figure">
  <div class="title">圖 5-4　兩組學生對教學介面之主觀回饋比較</div>
  <div class="subtitle">Section 3 平台回饋量表（Likert 1–5，1 = 非常不同意，5 = 非常同意）</div>
  <div class="chart-container">
    <canvas id="chart"></canvas>
  </div>
  <div class="footnote">
    註：實驗組 A（RL Lab，n=18）vs 對照組 B（Colab，n=12）。
    <span class="highlight">3-4「課後想繼續學 RL」差距最大（+0.90，p=0.089 趨近顯著）</span>。
    3-2 參數信心、3-3 視覺化幫助與 3-4 學習動機三項皆為 RL Lab 設計訴求面向，方向一致顯示實驗組勝出；
    3-1 介面易用與 3-5 推薦意願則對照組略勝（Colab 為熟悉工具，學生上手成本低）。
  </div>
</div>

<script>
const s = window.DATA.section3;

new Chart(document.getElementById('chart'), {
  type: 'bar',
  data: {
    labels: s.items,
    datasets: [
      {
        label: '實驗組 A（RL Lab）',
        data: s.A.map(v => +v.toFixed(2)),
        backgroundColor: 'rgba(46, 134, 222, 0.85)',
        borderColor: 'rgba(46, 134, 222, 1)',
        borderWidth: 2,
        borderRadius: 4,
      },
      {
        label: '對照組 B（Colab）',
        data: s.B.map(v => +v.toFixed(2)),
        backgroundColor: 'rgba(255, 159, 67, 0.85)',
        borderColor: 'rgba(255, 159, 67, 1)',
        borderWidth: 2,
        borderRadius: 4,
      },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'top', labels: { font: { size: 16 } } },
      tooltip: { enabled: false },
    },
    scales: {
      x: {
        ticks: { font: { size: 14, weight: 'bold' } },
        grid: { display: false },
      },
      y: {
        beginAtZero: true,
        max: 5,
        ticks: { font: { size: 14 }, stepSize: 1 },
        title: {
          display: true,
          text: '平均分數（Likert 1–5）',
          font: { size: 15 },
        },
        grid: { color: '#eee' },
      },
    },
  },
  plugins: [{
    id: 'valueLabels',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      ctx.save();
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      chart.data.datasets.forEach((ds, di) => {
        const meta = chart.getDatasetMeta(di);
        meta.data.forEach((bar, bi) => {
          const v = ds.data[bi];
          // 3-4 動機（idx=3）紅色突顯
          if (bi === 3) {
            ctx.font = 'bold 16px sans-serif';
            ctx.fillStyle = di === 0 ? '#c00' : '#666';
          } else {
            ctx.font = 'bold 13px sans-serif';
            ctx.fillStyle = di === 0 ? '#1a5f9e' : '#c97800';
          }
          ctx.fillText(v.toFixed(2), bar.x, bar.y - 8);
        });
      });
      ctx.restore();
    },
  }],
});
</script>
</body>
</html>
