<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>圖 5-5 SUS 系統易用性比較</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.4.1/build/index.umd.min.js"></script>
<script src="data.js"></script>
<style>
  body {
    margin: 0;
    padding: 40px;
    font-family: "標楷體", "DFKai-SB", "PMingLiU", serif;
    background: white;
    width: 1200px;
    height: 640px;
    box-sizing: border-box;
  }
  .figure { display: flex; flex-direction: column; align-items: center; height: 100%; }
  .chart-container { width: 1100px; height: 540px; position: relative; }
  .interpretation-bands {
    width: 1100px;
    display: flex;
    gap: 8px;
    font-size: 12px;
    color: #666;
    margin-top: 6px;
  }
  .band {
    padding: 4px 8px;
    background: #f5f5f5;
    border-radius: 4px;
  }
  .highlight { color: #c00; font-weight: bold; }
</style>
</head>
<body>
<div class="figure">
  <div class="chart-container">
    <canvas id="chart"></canvas>
  </div>
  <div class="interpretation-bands">
    <span class="band">參考標準：&lt;50 不可接受 ｜ 50–70 Marginal ｜ 70–85 Good ｜ &gt;85 Excellent</span>
  </div>
  </div>

<script>
const sus = window.DATA.sus;

const chartData = {
  labels: ['RR 組（全部 n=18）', 'RR 組（排除直線式 n=16）', 'Colab 組（n=12）'],
  datasets: [{
    label: 'SUS 分數',
    data: [sus.A_all, sus.A_clean, sus.B],
    backgroundColor: [
      'rgba(46, 134, 222, 0.4)',
      'rgba(46, 134, 222, 0.7)',
      'rgba(255, 159, 67, 0.7)',
    ],
    borderColor: [
      'rgba(46, 134, 222, 1)',
      'rgba(46, 134, 222, 1)',
      'rgba(255, 159, 67, 1)',
    ],
    borderWidth: 2,
    outlierBackgroundColor: '#888',
    outlierBorderColor: '#444',
    outlierRadius: 3,
    itemRadius: 4,
    itemStyle: 'circle',
    itemBackgroundColor: 'rgba(0,0,0,0.5)',
    medianColor: '#000',
  }],
};

new Chart(document.getElementById('chart'), {
  type: 'boxplot',
  data: chartData,
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: { enabled: false },
    },
    scales: {
      x: {
        ticks: { font: { size: 14, weight: 'bold' } },
        grid: { display: false },
      },
      y: {
        beginAtZero: true,
        max: 100,
        ticks: { font: { size: 13 }, stepSize: 10 },
        title: {
          display: true,
          text: 'SUS 分數（0–100）',
          font: { size: 15 },
        },
        grid: { color: '#eee' },
      },
    },
  },
  plugins: [{
    id: 'meanLine',
    beforeDatasetsDraw(chart) {
      // 畫業界標準帶
      const { ctx, scales: { x, y } } = chart;
      const bands = [
        { from: 0, to: 50, color: 'rgba(255, 100, 100, 0.05)' },
        { from: 50, to: 70, color: 'rgba(255, 200, 100, 0.05)' },
        { from: 70, to: 85, color: 'rgba(150, 220, 150, 0.05)' },
        { from: 85, to: 100, color: 'rgba(100, 200, 100, 0.08)' },
      ];
      ctx.save();
      bands.forEach(b => {
        const y1 = y.getPixelForValue(b.to);
        const y2 = y.getPixelForValue(b.from);
        ctx.fillStyle = b.color;
        ctx.fillRect(x.left, y1, x.right - x.left, y2 - y1);
      });
      // 畫 70 / 85 分界線
      [50, 70, 85].forEach(v => {
        const yp = y.getPixelForValue(v);
        ctx.strokeStyle = '#aaa';
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x.left, yp);
        ctx.lineTo(x.right, yp);
        ctx.stroke();
      });
      ctx.setLineDash([]);
      ctx.restore();
    },
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      const means = [
        sus.A_all.reduce((a,b)=>a+b,0) / sus.A_all.length,
        sus.A_clean.reduce((a,b)=>a+b,0) / sus.A_clean.length,
        sus.B.reduce((a,b)=>a+b,0) / sus.B.length,
      ];
      ctx.save();
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000';
      const meta = chart.getDatasetMeta(0);
      meta.data.forEach((box, i) => {
        const yp = chart.scales.y.getPixelForValue(means[i]);
        ctx.fillText(`M=${means[i].toFixed(1)}`, box.x, yp - 8);
      });
      ctx.restore();
    },
  }],
});
</script>
</body>
</html>
