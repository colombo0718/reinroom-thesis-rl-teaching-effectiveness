<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>圖 3-3　Q-Learning 訓練主迴圈與回溯軌跡機制流程圖</title>
<style>
  body { margin: 0; padding: 24px; background: #fff;
         font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  .figwrap { display: flex; justify-content: center; }
  .figwrap svg { width: 820px; height: auto; }
</style>
</head>
<body>
<div class="figwrap">
  <svg viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg">

    <!-- 箭頭 markers -->
    <defs>
      <marker id="arr-blue"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#0078d7"/>
      </marker>
      <marker id="arr-gray"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
      </marker>
      <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
      </marker>
    </defs>

    <!-- ============= 左欄：標準 Q-Learning 主迴圈 ============= -->
    <!-- 區塊背景 -->
    <rect x="20" y="20" width="340" height="500" rx="14" fill="#f6f9fc" stroke="#cbd6e2" stroke-width="1"/>
    <text x="190" y="46" text-anchor="middle" fill="#1e3a5f" font-size="14" font-weight="bold">標準 Q-Learning 訓練主迴圈</text>

    <!-- Episode 開始 -->
    <ellipse cx="190" cy="78" rx="78" ry="18" fill="#dbeafe" stroke="#0078d7" stroke-width="1.5"/>
    <text x="190" y="83" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Episode 開始</text>
    <line x1="190" y1="96" x2="190" y2="116" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- reset state -->
    <rect x="120" y="120" width="140" height="40" rx="6" fill="#fff" stroke="#0078d7" stroke-width="1.5"/>
    <text x="190" y="138" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">reset → 取得 state s</text>
    <text x="190" y="153" text-anchor="middle" fill="#555" font-size="10">清空回溯緩衝區</text>
    <line x1="190" y1="160" x2="190" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- select action -->
    <rect x="100" y="184" width="180" height="46" rx="6" fill="#fff" stroke="#0078d7" stroke-width="1.5"/>
    <text x="190" y="203" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">select action a</text>
    <text x="190" y="220" text-anchor="middle" fill="#555" font-size="10">ε-greedy / Softmax 探索策略</text>
    <line x1="190" y1="230" x2="190" y2="250" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- env step -->
    <rect x="120" y="254" width="140" height="40" rx="6" fill="#fff" stroke="#0078d7" stroke-width="1.5"/>
    <text x="190" y="272" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">env.step(a)</text>
    <text x="190" y="287" text-anchor="middle" fill="#555" font-size="10">得 (r, s′, done)</text>
    <line x1="190" y1="294" x2="190" y2="314" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- Bellman update -->
    <rect x="80" y="318" width="220" height="58" rx="6" fill="#e8f4fb" stroke="#0078d7" stroke-width="2"/>
    <text x="190" y="338" text-anchor="middle" fill="#0078d7" font-size="12" font-weight="bold">Bellman 更新 Q(s, a)</text>
    <text x="190" y="356" text-anchor="middle" fill="#374151" font-size="10">Q ← Q + α[r + γ · targetQ − Q]</text>
    <text x="190" y="370" text-anchor="middle" fill="#555"   font-size="9">targetQ 由 ψ 控制（SARSA / Q / 悲觀）</text>
    <line x1="190" y1="376" x2="190" y2="396" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- buffer push -->
    <rect x="100" y="400" width="180" height="40" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
    <text x="190" y="418" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="bold">push (s, a, r, s′) 入緩衝區</text>
    <text x="190" y="432" text-anchor="middle" fill="#555" font-size="10">若 r ≠ 0 → 觸發回溯</text>
    <line x1="190" y1="440" x2="190" y2="460" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- s ← s' -->
    <rect x="140" y="464" width="100" height="32" rx="6" fill="#fff" stroke="#0078d7" stroke-width="1.5"/>
    <text x="190" y="484" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">s ← s′</text>

    <!-- 回到 select action 的箭頭（走左側） -->
    <path d="M 140,480 Q 60,480 60,207 L 100,207"
          fill="none" stroke="#0078d7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
    <text x="28" y="345" fill="#0078d7" font-size="11" font-weight="bold">未結束</text>
    <text x="28" y="360" fill="#0078d7" font-size="11" font-weight="bold">→ 下一步</text>

    <!-- done 結束（移到右側） -->
    <ellipse cx="300" cy="480" rx="38" ry="16" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
    <text x="300" y="485" text-anchor="middle" fill="#14532d" font-size="11" font-weight="bold">done</text>
    <line x1="240" y1="480" x2="260" y2="480" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- ============= 右欄：回溯軌跡機制 ============= -->
    <rect x="380" y="20" width="320" height="500" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
    <text x="540" y="46" text-anchor="middle" fill="#9a3412" font-size="14" font-weight="bold">回溯軌跡機制（Backward Trace）</text>

    <!-- 緩衝區示意 -->
    <text x="540" y="76" text-anchor="middle" fill="#9a3412" font-size="11" font-weight="bold">長度上限 5 步的歷史緩衝區</text>

    <g>
      <rect x="410" y="92" width="50" height="48" rx="4" fill="#fff" stroke="#d97706" stroke-width="1.2"/>
      <text x="435" y="108" text-anchor="middle" fill="#9a3412" font-size="10">t−4</text>
      <text x="435" y="124" text-anchor="middle" fill="#555" font-size="9">(s,a,r,s′)</text>

      <rect x="466" y="92" width="50" height="48" rx="4" fill="#fff" stroke="#d97706" stroke-width="1.2"/>
      <text x="491" y="108" text-anchor="middle" fill="#9a3412" font-size="10">t−3</text>
      <text x="491" y="124" text-anchor="middle" fill="#555" font-size="9">(s,a,r,s′)</text>

      <rect x="522" y="92" width="50" height="48" rx="4" fill="#fff" stroke="#d97706" stroke-width="1.2"/>
      <text x="547" y="108" text-anchor="middle" fill="#9a3412" font-size="10">t−2</text>
      <text x="547" y="124" text-anchor="middle" fill="#555" font-size="9">(s,a,r,s′)</text>

      <rect x="578" y="92" width="50" height="48" rx="4" fill="#fff" stroke="#d97706" stroke-width="1.2"/>
      <text x="603" y="108" text-anchor="middle" fill="#9a3412" font-size="10">t−1</text>
      <text x="603" y="124" text-anchor="middle" fill="#555" font-size="9">(s,a,r,s′)</text>

      <rect x="634" y="92" width="50" height="48" rx="4" fill="#ffedd5" stroke="#d97706" stroke-width="2"/>
      <text x="659" y="108" text-anchor="middle" fill="#9a3412" font-size="10" font-weight="bold">t</text>
      <text x="659" y="124" text-anchor="middle" fill="#555" font-size="9">(s,a,r,s′)</text>
    </g>
    <text x="540" y="158" text-anchor="middle" fill="#555" font-size="10">← 新進入　　舊資料於滿 5 時自動丟棄 →</text>

    <!-- 觸發判斷 -->
    <polygon points="540,190 620,228 540,266 460,228"
             fill="#fff" stroke="#d97706" stroke-width="1.8"/>
    <text x="540" y="225" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="bold">r ≠ 0 ?</text>
    <text x="540" y="241" text-anchor="middle" fill="#555" font-size="10">（reward 訊號出現）</text>

    <text x="624" y="232" fill="#15803d" font-size="11" font-weight="bold">Yes</text>
    <line x1="540" y1="266" x2="540" y2="290" stroke="#15803d" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- 批次回溯更新 -->
    <rect x="420" y="294" width="240" height="78" rx="8" fill="#fff" stroke="#d97706" stroke-width="2"/>
    <text x="540" y="316" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="bold">批次回溯更新</text>
    <text x="540" y="335" text-anchor="middle" fill="#374151" font-size="10">對緩衝區內所有 (s, a, r, s′) 各做一次</text>
    <text x="540" y="350" text-anchor="middle" fill="#374151" font-size="10">Bellman 更新（等權，無衰減）</text>
    <text x="540" y="365" text-anchor="middle" fill="#555" font-size="9">→ reward 訊號於同一 episode 內快速向前傳播</text>

    <line x1="540" y1="372" x2="540" y2="396" stroke="#555" stroke-width="1.5" marker-end="url(#arr-gray)"/>

    <!-- 對照說明 -->
    <rect x="402" y="400" width="276" height="98" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="540" y="422" text-anchor="middle" fill="#9a3412" font-size="11" font-weight="bold">設計理念</text>
    <text x="540" y="442" text-anchor="middle" fill="#374151" font-size="10">概念上類似 Eligibility Trace（TD(λ)），</text>
    <text x="540" y="458" text-anchor="middle" fill="#374151" font-size="10">但採「等權、無衰減、固定長度 5」之簡化版本，</text>
    <text x="540" y="474" text-anchor="middle" fill="#374151" font-size="10">於教學情境中更易說明、學生更易觀察</text>
    <text x="540" y="490" text-anchor="middle" fill="#374151" font-size="10">獎勵訊號的傳播過程。</text>

    <!-- 連接左欄 buffer push → 右欄緩衝區 -->
    <path d="M 280,420 Q 340,420 360,140 L 405,116"
          fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
    <text x="340" y="280" text-anchor="middle" fill="#d97706" font-size="10" font-weight="bold">每步</text>
    <text x="340" y="294" text-anchor="middle" fill="#d97706" font-size="10" font-weight="bold">push</text>

  </svg>
</div>
</body>
</html>
