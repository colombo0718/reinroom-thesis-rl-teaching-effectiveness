<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>圖：兩組配對樣本前後測增益比較</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script src="data.js"></script>
<style>
  body {
    margin: 0;
    padding: 40px;
    font-family: "標楷體", "DFKai-SB", "PMingLiU", serif;
    background: white;
    width: 1200px;
    height: 640px;
    box-sizing: border-box;
  }
  .figure { display: flex; flex-direction: column; align-items: center; height: 100%; }
  .chart-container {
    width: 1100px;
    height: 100%;
    position: relative;
  }
</style>
</head>
<body>
<div class="figure">
  <div class="chart-container"><canvas id="chart"></canvas></div>
</div>

<script>
const colors = {
  A_pre: 'rgba(46, 134, 222, 0.4)',
  A_post: 'rgba(46, 134, 222, 0.85)',
  A_border: 'rgba(46, 134, 222, 1)',
  B_pre: 'rgba(255, 159, 67, 0.4)',
  B_post: 'rgba(255, 159, 67, 0.85)',
  B_border: 'rgba(255, 159, 67, 1)',
};

const ds = window.DATA.stats;

new Chart(document.getElementById('chart'), {
  type: 'bar',
  data: {
    labels: ['RR 組（n=10）', 'Colab 組（n=12）'],
    datasets: [
      {
        label: '前測',
        data: [ds.concept_paired_A.pre_M, ds.concept_paired_B.pre_M],
        backgroundColor: [colors.A_pre, colors.B_pre],
        borderColor: [colors.A_border, colors.B_border],
        borderWidth: 2,
        borderRadius: 3,
      },
      {
        label: '後測',
        data: [ds.concept_paired_A.post_M, ds.concept_paired_B.post_M],
        backgroundColor: [colors.A_post, colors.B_post],
        borderColor: [colors.A_border, colors.B_border],
        borderWidth: 2,
        borderRadius: 3,
      },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'top', labels: { font: { size: 16 } } },
      tooltip: { enabled: false },
    },
    scales: {
      x: { ticks: { font: { size: 16, weight: 'bold' } }, grid: { display: false } },
      y: {
        beginAtZero: true, max: 8,
        ticks: { font: { size: 14 }, stepSize: 1 },
        title: { display: true, text: '平均分數（滿分 8）', font: { size: 15 } },
        grid: { color: '#eee' },
      },
    },
  },
  plugins: [{
    id: 'gainArrow',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      const meta0 = chart.getDatasetMeta(0); // 前測
      const meta1 = chart.getDatasetMeta(1); // 後測
      const sigs = ['n.s.', 'p=.01*'];
      ctx.save();
      for (let i = 0; i < 2; i++) {
        const postBar = meta1.data[i];
        const gainVal = chart.data.datasets[1].data[i] - chart.data.datasets[0].data[i];
        const sig = sigs[i];
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        const isSig = sig.includes('*');
        ctx.fillStyle = isSig ? '#c00' : '#444';
        const labelY = postBar.y - 12;
        ctx.fillText(`+${gainVal.toFixed(2)} ${sig}`, postBar.x, labelY);
      }
      ctx.restore();
    },
  }],
});
</script>
</body>
</html>
