<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>圖 5-1 兩組前後測分數箱型圖</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.4.1/build/index.umd.min.js"></script>
<script src="data.js"></script>
<style>
  body {
    margin: 0;
    padding: 40px;
    font-family: "標楷體", "DFKai-SB", "PMingLiU", serif;
    background: white;
    width: 1200px;
    height: 800px;
    box-sizing: border-box;
  }
  .figure {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
  }
  .title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 14px;
    color: #555;
    margin-bottom: 20px;
  }
  .chart-container {
    width: 1100px;
    height: 580px;
    position: relative;
  }
  .footnote {
    margin-top: 16px;
    font-size: 13px;
    color: #444;
    line-height: 1.6;
    max-width: 1100px;
  }
  .stats-line {
    font-size: 13px;
    color: #444;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="figure">
  <div class="title">圖 5-1　兩組學生前測與後測分數分佈箱型圖</div>
  <div class="subtitle">概念測驗滿分 8 分（5 概念題 + 3 圖表判讀題）</div>
  <div class="chart-container">
    <canvas id="chart"></canvas>
  </div>
  <div class="footnote">
    註：箱型圖呈現中位數（橫線）、四分位距（盒）、最大最小值（鬚）；圓點為個別學生分數。
    實驗組 A 為大學部資工大二生（n=26 前測 / n=18 後測），對照組 B 為碩士班資工碩一生（n=15 前測 / n=12 後測）。
    兩組前測差異不顯著（t=+1.116, p=0.27），具基線可比性。
  </div>
</div>

<script>
const c = window.DATA.concept_test;

const chartData = {
  labels: ['A 組前測', 'A 組後測', 'B 組前測', 'B 組後測'],
  datasets: [{
    label: '分數分佈',
    data: [
      c.A_pre_all,
      c.A_post_all,
      c.B_pre_all,
      c.B_post_all,
    ],
    backgroundColor: [
      'rgba(46, 134, 222, 0.4)',
      'rgba(46, 134, 222, 0.7)',
      'rgba(255, 159, 67, 0.4)',
      'rgba(255, 159, 67, 0.7)',
    ],
    borderColor: [
      'rgba(46, 134, 222, 1)',
      'rgba(46, 134, 222, 1)',
      'rgba(255, 159, 67, 1)',
      'rgba(255, 159, 67, 1)',
    ],
    borderWidth: 2,
    outlierBackgroundColor: '#888',
    outlierBorderColor: '#444',
    outlierRadius: 3,
    itemRadius: 4,
    itemStyle: 'circle',
    itemBackgroundColor: 'rgba(0,0,0,0.5)',
    medianColor: '#000',
  }],
};

new Chart(document.getElementById('chart'), {
  type: 'boxplot',
  data: chartData,
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: { enabled: false },
    },
    scales: {
      x: {
        ticks: { font: { size: 16, weight: 'bold' } },
        grid: { display: false },
      },
      y: {
        beginAtZero: true,
        max: 8.5,
        ticks: {
          font: { size: 14 },
          stepSize: 1,
        },
        title: {
          display: true,
          text: '分數（滿分 8）',
          font: { size: 15 },
        },
        grid: { color: '#eee' },
      },
    },
  },
  plugins: [{
    id: 'meanLabel',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      ctx.save();
      const means = [
        c.A_pre_all.reduce((a,b)=>a+b,0) / c.A_pre_all.length,
        c.A_post_all.reduce((a,b)=>a+b,0) / c.A_post_all.length,
        c.B_pre_all.reduce((a,b)=>a+b,0) / c.B_pre_all.length,
        c.B_post_all.reduce((a,b)=>a+b,0) / c.B_post_all.length,
      ];
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000';
      const meta = chart.getDatasetMeta(0);
      meta.data.forEach((box, i) => {
        const y = chart.scales.y.getPixelForValue(means[i]);
        ctx.fillText(`M=${means[i].toFixed(2)}`, box.x, y + 30);
      });
      ctx.restore();
    },
  }],
});
</script>
</body>
</html>
